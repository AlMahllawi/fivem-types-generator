name: Release Extension

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v (e.g., v1.0.0, v1.2)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Package VSIX
        run: npx @vscode/vsce package -o fivem-lua-definitions-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: fivem-lua-definitions-${{ github.ref_name }}.vsix
          generate_release_notes: true
