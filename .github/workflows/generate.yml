name: Generate and Commit FiveM Definitions

on:
  workflow_call:
    inputs:
      resource-path:
        description: 'Path to the FiveM resource directory'
        required: false
        type: string
        default: '.'
      output-path:
        description: 'Output directory for generated definitions'
        required: false
        type: string
        default: './definitions'
      resource-name:
        description: 'Custom resource name for exports (defaults to folder name)'
        required: false
        type: string
      commit-changes:
        description: 'Automatically commit and push generated definitions if changes are detected'
        required: false
        type: boolean
        default: true
      fail-on-warning:
        description: 'Fail the workflow if warnings are emitted'
        required: false
        type: boolean
        default: false
      commit-message:
        description: 'Commit message for the updated type definitions'
        required: false
        type: string
        default: 'chore(definitions): update type definitions'

jobs:
  generate:
    name: Generate Definitions
    # Universal loop prevention: skip ONLY this job if this commit was generated by our tool
    if: "!contains(github.event.head_commit.message, 'X-FiveM-Lua-Definitions-Generated: true')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4

      - name: Generate Lua Definitions
        id: definitions
        uses: AlMahllawi/fivem-lua-definitions/.github/actions/generate@v1.0.0
        with:
          resource-path: ${{ inputs.resource-path }}
          output-path: ${{ inputs.output-path }}
          resource-name: ${{ inputs.resource-name }}
          fail-on-warning: ${{ inputs.fail-on-warning }}

      - name: Commit and Push Updated Definitions
        if: inputs.commit-changes && steps.definitions.outputs.has-changes == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output-path }}"
          git commit -m "${{ inputs.commit-message }}" \
                     -m "X-FiveM-Lua-Definitions-Generated: true"
          git push
